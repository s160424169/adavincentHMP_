<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pengaturan</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset="true" class="daftar-animasi">
    <ion-list-header>Tampilan</ion-list-header>
    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Mode Gelap</ion-label>
      <ion-toggle [checked]="modeGelap" (ionChange)="onToggleModeGelap($event)"></ion-toggle>
    </ion-item>
  </ion-list>

  <ion-list inset="true" class="daftar-animasi daftar-tertunda">
    <ion-list-header>Toko</ion-list-header>
    <ion-item>
      <ion-icon name="storefront-outline" slot="start"></ion-icon>
      <ion-label>
        <h3>Toko Makmur Jaya</h3>
        <p>Tema warna: Hijau &ndash; Kuning</p>
      </ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-icon name="information-circle-outline" slot="start"></ion-icon>
      <ion-label class="ion-text-wrap">
        <p>SIMOBILE v1.0 &mdash; data tersimpan langsung di perangkat, tanpa koneksi internet.</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
